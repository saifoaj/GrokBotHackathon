<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Decision Path</title>
<link rel="stylesheet" href="common.css">
<style>
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 80px; }
  .head { text-align: center; margin-bottom: 28px; display: grid; gap: 8px; justify-items: center; }
  .head h1 { font-size: 26px; }
  .tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 4px 0 20px; }
  .tabs button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .tabs button.on { background: var(--text); color: var(--bg); border-color: var(--text); }
  .flow { position: relative; display: grid; gap: 0; }
  .step { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 16px; padding-bottom: 18px; }
  .step::before { content: ""; position: absolute; left: 27px; top: 44px; bottom: 0; width: 2px; background: var(--line-2); }
  .step:last-child::before { display: none; }
  .node { width: 56px; height: 44px; border-radius: 14px; display: grid; place-items: center; font: 700 15px var(--mono); background: var(--panel); border: 2px solid var(--line-2); color: var(--muted); z-index: 1; }
  .box { padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); box-shadow: var(--shadow); }
  .box h3 { font-size: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .box p { margin: 6px 0 0; color: var(--muted); }
  .box .pol { margin-left: auto; font: 500 11px var(--mono); color: var(--faint); }
  .fired .node { background: var(--diff); border-color: var(--diff); color: #fff; }
  .fired .box { border-color: var(--diff); background: linear-gradient(0deg, var(--diff-soft), var(--diff-soft)), var(--panel); }
  .blocked .node { background: var(--rev); border-color: var(--rev); color: #fff; }
  .blocked .box { border-color: var(--rev); }
  .na .node { border-style: dashed; } .na .box { box-shadow: none; background: transparent; border-style: dashed; }
  .passed .node { color: var(--text); }
  .info .node { background: var(--accent); border-color: var(--accent); color: #fff; }
  .end .node { width: 56px; height: 56px; border-radius: 50%; }
  .end.DIFFERENT_ENTITY .node { background: var(--diff); border-color: var(--diff); color: #fff; }
  .end.SAME_ENTITY .node { background: var(--same); border-color: var(--same); color: #fff; }
  .end.REVIEW .node { background: var(--rev); border-color: var(--rev); color: #fff; }
  .end .box { border-width: 2px; }
  .here { font: 700 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--diff); }
  .legend { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 24px; }
  .legend span { display: inline-flex; gap: 6px; align-items: center; }
  .sw { width: 14px; height: 14px; border-radius: 4px; display: inline-block; border: 2px solid var(--line-2); }
</style>
</head>
<body>
<main>
  <div class="head" id="head"></div>
  <div class="tabs" id="tabs"></div>
  <div class="flow" id="flow"></div>
  <div class="legend">
    <span><i class="sw" style="background:var(--diff);border-color:var(--diff)"></i>Contradiction: clears the hit</span>
    <span><i class="sw" style="background:var(--rev);border-color:var(--rev)"></i>Guard stopped a clear</span>
    <span><i class="sw"></i>Checked, no contradiction</span>
    <span><i class="sw" style="border-style:dashed"></i>Could not check (data missing)</span>
  </div>
</main>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
const { DEC, CODE, RULE, STATUS, esc, pill, chip, onHit } = UX;
UX.nav("v02-decision-path.html");
let pIdx = 0, lastHit = null;
const ICON = { fired: "✕", passed: "✓", blocked: "!", "n/a": "?", info: "Σ" };

function render(h) {
  if (lastHit !== h.hit_id) { pIdx = Math.max(0, h.persons.findIndex(p => p.record === h.record)); lastHit = h.hit_id; }
  const c = h.alert.customer;
  document.getElementById("head").innerHTML = `${pill(h.decision)}<h1>${esc(c.name)} <span class="faint" style="font-weight:400">vs</span> ${esc(h.hit.name)}</h1>
    <span class="muted">${h.hit_id} · ${esc(h.hit.primary || h.hit.categories.join(", "))} · screened ${esc(h.alert.screened_at)}</span>`;
  document.getElementById("tabs").innerHTML = h.persons.length > 1
    ? `<span class="muted" style="font-size:13px;align-self:center">${h.persons.length} people fit, each decided separately:</span>` + h.persons.map((p, i) => `<button class="${i === pIdx ? "on" : ""}" data-i="${i}">${esc(p.record)} → ${UX.DEC_SHORT[p.decision]}</button>`).join("")
    : "";
  const p = h.persons[pIdx];
  const steps = [];
  steps.push({ cls: "passed", n: "1", title: "Find the customer", pol: "POLICY 2",
    body: (h.alert.link ? `Followed <b>${esc(h.alert.link.kind)}</b> <span class="mono">${esc(h.alert.link.value)}</span> → ${h.alert.linked.map(r => chip(r)).join(" ")}. ` : "No link on the alert, so every customer record was searched for the screened name, date of birth, country and city. ")
      + (h.persons.length ? `${h.persons.length === 1 ? "One person fits" : `<b>${h.persons.length} different people</b> fit`}${p && p.records.length > 1 ? `; this person has ${p.records.length} records (${p.merges.map(m => esc(m.why)).join("; ")})` : ""}.` : "<b>No customer record fits</b>, so nothing can be compared.") });
  if (p) {
    steps.push({ cls: "passed", n: "2", title: "Build both pictures", pol: "POLICY 4 · 5",
      body: `Customer: ${p.verified_name ? `verified name <b>${esc(p.verified_name.v)}</b> ${chip(p.verified_name.src)}` : "no verified name"}, born ${p.dobs.map(d => `<b>${esc(d.v)}</b> ${d.src.map(s => chip(s)).join(" ")}`).join(" / ") || "unknown"}, linked to ${[...new Set(p.countries.map(x => x.name))].join(", ") || "no country"}.<br>
        Hit: born ${h.hit.dobs.map(x => `<b>${UX.years(x)}</b> <span class="faint">(${esc(x.kind)})</span>`).join(", ") || "unknown"}, linked to ${[...new Set(h.hit.countries.map(x => x.name))].join(", ") || "no country"}${h.hit.reports.length ? `, earliest dated report ${esc(h.hit.reports[0])}` : ""}.` });
    let firstFired = true;
    p.trace.forEach((t, i) => {
      const cls = t.status === "n/a" ? "na" : t.status;
      const here = t.status === "fired" && firstFired; if (here) firstFired = false;
      steps.push({ cls, n: ICON[t.status], title: `${RULE[t.rule] || t.rule} <span class="st ${t.status}">${STATUS[t.status]}</span>${here ? '<span class="here">◆ decided here</span>' : ""}`,
        pol: `POLICY ${t.policy}`, body: esc(t.detail) });
    });
  }
  const final = p || { decision: h.decision, codes: [h.code], sentences: [h.reason] };
  steps.push({ cls: `end ${h.decision}`, n: ICON[h.decision === "DIFFERENT_ENTITY" ? "fired" : h.decision === "SAME_ENTITY" ? "passed" : "blocked"],
    title: `${DEC[h.decision]} <span class="mono faint" style="font-weight:500">${esc(h.code)}</span>`, pol: "output",
    body: `${esc(h.reason)}<div style="margin-top:8px">${h.evidence.map(e => chip(e, true)).join(" ")}</div>` +
      (h.persons.length > 1 ? `<div style="margin-top:8px" class="faint">This tab shows ${esc(p.record)}, which alone would give ${esc(p.decision)}.</div>` : "") });
  document.getElementById("flow").innerHTML = steps.map(s => `
    <div class="step ${s.cls}"><div class="node">${s.n}</div>
      <div class="box"><h3>${s.title}<span class="pol">${esc(s.pol)}</span></h3><p>${s.body}</p></div></div>`).join("");
}
document.getElementById("tabs").onclick = e => { const b = e.target.closest("button"); if (b) { pIdx = +b.dataset.i; render(UX.current()); } };
onHit(render);
</script>
</body>
</html>
