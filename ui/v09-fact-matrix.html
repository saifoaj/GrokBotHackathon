<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fact Matrix</title>
<link rel="stylesheet" href="common.css">
<style>
  .wrap { display: grid; grid-template-columns: 1fr 400px; height: calc(100vh - 57px); }
  .left { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .tools { padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel); }
  .scroll { overflow: auto; flex: 1; }
  table { border-collapse: separate; border-spacing: 0; font-size: 12.5px; width: 100%; }
  th { position: sticky; top: 0; background: var(--panel); z-index: 2; text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line-2); font-weight: 600; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
  th.r { text-align: center; } th .sum { display: block; font: 500 10.5px var(--mono); color: var(--faint); }
  td { padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr { cursor: pointer; } tr:hover td { background: var(--panel-2); } tr.sel td { background: var(--accent-soft); }
  td.n { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  td.cell { text-align: center; padding: 3px; }
  .c { width: 30px; height: 20px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; }
  .c.fired { background: var(--diff); color: #fff; } .c.passed { background: var(--na-soft); color: var(--muted); }
  .c.agree { background: var(--same); color: #fff; } .c.blocked { background: var(--rev); color: #fff; } .c.na { background: transparent; border: 1px dashed var(--line-2); color: var(--faint); }
  .dec { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .side { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 18px; display: grid; gap: 14px; align-content: start; }
  .side h2 { font-size: 18px; }
  .r2 { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: start; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 13px; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
  @media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; height: auto; } .scroll { max-height: 60vh; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div class="tools">
      <input class="input" id="q" placeholder="Filter…" style="width:200px">
      <select class="select" id="fd"><option value="">All decisions</option><option value="DIFFERENT_ENTITY">Cleared</option><option value="SAME_ENTITY">Match</option><option value="REVIEW">Review</option></select>
      <span class="legend"><span class="c fired">✕</span>contradiction <span class="c agree">=</span>agrees <span class="c passed">·</span>no contradiction <span class="c blocked">!</span>guard <span class="c na">?</span>can't check</span>
      <span class="faint" id="cnt" style="margin-left:auto;font-size:12px"></span>
    </div>
    <div class="scroll"><table id="t"></table></div>
  </div>
  <aside class="side" id="side"></aside>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
const { HITS, RULE, STATUS, esc, pill, chip, go, onHit } = UX;
UX.nav("v09-fact-matrix.html");
const COLS = ["ENTITY_TYPE_MISMATCH", "DECEASED", "TEMPORAL_IMPOSSIBILITY", "DOB_MISMATCH", "LOCATION_MISMATCH", "NAME_MISMATCH_VERIFIED"];
const SHORT = { ENTITY_TYPE_MISMATCH: "Type", DECEASED: "Death", TEMPORAL_IMPOSSIBILITY: "Age@report", DOB_MISMATCH: "DOB", LOCATION_MISMATCH: "Country", NAME_MISMATCH_VERIFIED: "Name" };
const DC = { DIFFERENT_ENTITY: "var(--diff)", SAME_ENTITY: "var(--same)", REVIEW: "var(--rev)" };
function cellState(h, r) {
  const p = UX.person(h); const t = p?.trace.find(x => x.rule === r); if (!t) return ["na", "no customer"];
  const ag = p.trace.find(x => x.rule === "AGREEMENT")?.detail || "";
  let s = t.status === "n/a" ? "na" : t.status;
  if (s === "passed" && ((r === "DOB_MISMATCH" && ag.includes("date of birth agrees")) || (r === "NAME_MISMATCH_VERIFIED" && ag.startsWith("name agrees")) || (r === "LOCATION_MISMATCH" && !ag.endsWith("none")))) s = "agree";
  return [s, t.detail];
}
const SYM = { fired: "✕", passed: "·", agree: "=", blocked: "!", na: "?" };
const ORDER = { fired: 0, blocked: 1, agree: 2, passed: 3, na: 4 };
const M = HITS.map(h => ({ h, cells: COLS.map(r => cellState(h, r)) }));
let sortCol = -1;
const sums = COLS.map((_, i) => ({ fired: M.filter(m => m.cells[i][0] === "fired").length, na: M.filter(m => m.cells[i][0] === "na").length }));
function table() {
  const q = document.getElementById("q").value.toLowerCase(), fd = document.getElementById("fd").value, cur = UX.current().hit_id;
  let rows = M.filter(m => (!fd || m.h.decision === fd) && (!q || `${m.h.hit_id} ${m.h.hit.name} ${m.h.alert.customer.name} ${m.h.code}`.toLowerCase().includes(q)));
  if (sortCol >= 0) rows = [...rows].sort((a, b) => ORDER[a.cells[sortCol][0]] - ORDER[b.cells[sortCol][0]]);
  document.getElementById("cnt").textContent = `${rows.length} hits × ${COLS.length} rules`;
  document.getElementById("t").innerHTML = `<tr><th></th><th>Hit</th><th>Customer</th>${COLS.map((r, i) => `<th class="r" data-i="${i}">${SHORT[r]}${sortCol === i ? " ↓" : ""}<span class="sum">${sums[i].fired} ✕ · ${sums[i].na} ?</span></th>`).join("")}<th>Outcome</th></tr>` +
    rows.map(m => `<tr data-h="${m.h.hit_id}" class="${m.h.hit_id === cur ? "sel" : ""}"><td><span class="dec" style="background:${DC[m.h.decision]}"></span></td><td class="n"><span class="mono faint">${m.h.hit_id}</span> ${esc(m.h.hit.name)}</td><td class="n">${esc(m.h.alert.customer.name)}</td>
      ${m.cells.map(([s, d]) => `<td class="cell"><span class="c ${s}" title="${esc(d)}">${SYM[s]}</span></td>`).join("")}<td class="mono faint" style="font-size:11px">${m.h.code}</td></tr>`).join("");
  document.querySelector("tr.sel")?.scrollIntoView({ block: "center" });
}
document.getElementById("t").onclick = e => { const th = e.target.closest("th[data-i]"); if (th) { sortCol = sortCol === +th.dataset.i ? -1 : +th.dataset.i; table(); return; } const tr = e.target.closest("tr[data-h]"); if (tr) go(tr.dataset.h); };
document.getElementById("q").oninput = table; document.getElementById("fd").onchange = table;
function side(h) {
  const cells = COLS.map(r => cellState(h, r));
  document.getElementById("side").innerHTML = `${pill(h.decision)}<h2>${esc(h.alert.customer.name)} <span class="faint" style="font-weight:400">vs</span> ${esc(h.hit.name)}</h2>
    <div class="muted">${esc(h.reason)}</div><div>${h.evidence.map(e => chip(e, true)).join(" ")}</div>
    <div>${COLS.map((r, i) => `<div class="r2"><span><span class="c ${cells[i][0]}">${SYM[cells[i][0]]}</span> ${SHORT[r]}</span><span class="muted">${esc(cells[i][1])}</span></div>`).join("")}</div>
    <a class="btn" style="justify-self:start" data-vlink="v02-decision-path.html" href="v02-decision-path.html#${h.hit_id}">See the decision path →</a>`;
}
onHit(h => { table(); side(h); });
</script>
</body>
</html>
