<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Case File</title>
<link rel="stylesheet" href="common.css">
<style>
  .layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 57px); }
  aside.list { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  .filters { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .seg button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .items { overflow: auto; flex: 1; }
  .item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: grid; gap: 3px; }
  .item:hover { background: var(--panel-2); }
  .item.sel { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
  .item .t { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .item .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
  section.main { overflow: auto; padding: 24px; display: grid; gap: 16px; align-content: start; grid-auto-rows: max-content; max-width: 1100px; }
  .verdict { padding: 22px; display: grid; gap: 12px; border-left: 6px solid var(--c); }
  .verdict h1 { font-size: 24px; }
  .verdict .reason { font-size: 15px; line-height: 1.65; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  table.cmp { width: 100%; border-collapse: collapse; }
  table.cmp th, table.cmp td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.cmp th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  table.cmp td:first-child { font-weight: 600; width: 120px; }
  .sec { padding: 18px; } .sec h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 12px; }
  .rules { display: grid; gap: 6px; }
  .rules .r { display: grid; grid-template-columns: 170px 140px 1fr; gap: 10px; align-items: center; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  .srcs { display: flex; flex-wrap: wrap; gap: 6px; }
  .labelbox { font-size: 13px; padding: 12px 14px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; height: auto; } aside.list { max-height: 45vh; } .two { grid-template-columns: 1fr; } .rules .r { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="list">
    <div class="filters">
      <input class="input" id="q" placeholder="Filter by name, ID, code…">
      <div class="seg" id="seg"></div>
      <span class="faint" id="count" style="font-size:12px"></span>
    </div>
    <div class="items" id="items"></div>
  </aside>
  <section class="main" id="main"></section>
</div>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
const { HITS, DEC, CODE, RULE, esc, pill, st, chip, person, years, go, onHit } = UX;
UX.nav("v01-case-file.html");
let filter = "ALL", q = "";
const segs = [["ALL", "All"], ["DIFFERENT_ENTITY", "Cleared"], ["SAME_ENTITY", "Match"], ["REVIEW", "Review"], ["LABEL", "Practice labels"]];
const seg = document.getElementById("seg");
seg.innerHTML = segs.map(([k, v]) => `<button data-f="${k}">${v}</button>`).join("");
seg.onclick = e => { const b = e.target.closest("button"); if (b) { filter = b.dataset.f; renderList(); } };
document.getElementById("q").oninput = e => { q = e.target.value.toLowerCase(); renderList(); };

function renderList() {
  const cur = UX.current().hit_id;
  seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
  const rows = HITS.filter(h => (filter === "ALL" || h.decision === filter || (filter === "LABEL" && h.label)) &&
    (!q || `${h.hit_id} ${h.alert_id} ${h.hit.name} ${h.alert.customer.name} ${h.code}`.toLowerCase().includes(q)));
  document.getElementById("count").textContent = `${rows.length} hits`;
  document.getElementById("items").innerHTML = rows.map(h => `
    <div class="item ${h.hit_id === cur ? "sel" : ""}" data-h="${h.hit_id}">
      <div class="t"><span class="nm">${esc(h.alert.customer.name)}</span>${pill(h.decision)}</div>
      <div class="muted" style="font-size:12px">vs <b>${esc(h.hit.name)}</b> · ${(h.hit.primary || h.hit.categories[0] || "")}</div>
      <div class="faint mono" style="font-size:11px">${h.hit_id} · ${h.code}</div>
    </div>`).join("");
}
document.getElementById("items").onclick = e => { const it = e.target.closest(".item"); if (it) go(it.dataset.h); };

const linkReason = (text, ev) => esc(text).replace(/\b((?:CUS|KYC|NOTE|SR)-[0-9A-F]{6})\b/g, m => chip(m, ev.includes(m)));

function render(h) {
  renderList();
  document.querySelector(".item.sel")?.scrollIntoView({ block: "nearest" });
  const p = person(h), c = h.alert.customer, color = { DIFFERENT_ENTITY: "var(--diff)", SAME_ENTITY: "var(--same)", REVIEW: "var(--rev)" }[h.decision];
  const custName = p ? (p.verified_name ? `${esc(p.verified_name.v)} ${chip(p.verified_name.src, h.evidence.includes(p.verified_name.src))} <span class="faint">verified</span>` : p.names.map(n => esc(n.v)).filter((v, i, a) => a.indexOf(v) === i).join(" / ")) : "–";
  const custDob = p && p.dobs.length ? p.dobs.map(d => `${esc(d.v)} ${d.src.map(s => chip(s, h.evidence.includes(s))).join(" ")}`).join("<br>") + (p.dob_verified ? ' <span class="faint">verified</span>' : "") : '<span class="faint">unknown</span>';
  const custCountries = p && p.countries.length ? [...new Set(p.countries.map(x => x.name))].map(n => `${esc(n)} ${p.countries.filter(x => x.name === n).map(x => chip(x.src, h.evidence.includes(x.src))).join(" ")}`).join("<br>") : '<span class="faint">none</span>';
  const hitDob = h.hit.dobs.length ? h.hit.dobs.map(x => `${years(x)} <span class="faint">${esc(x.kind)}</span>${x.src.startsWith("SR-") ? " " + chip(x.src, h.evidence.includes(x.src)) : ""}`).join("<br>") : '<span class="faint">none given</span>';
  const hitCountries = h.hit.countries.length ? [...new Set(h.hit.countries.map(x => x.name))].map(n => `${esc(n)} <span class="faint">${h.hit.countries.filter(x => x.name === n).map(x => x.src).join(", ")}</span>`).join("<br>") : '<span class="faint">none</span>';
  const rule = r => (p?.trace || []).find(t => t.rule === r);
  const rowSt = r => rule(r) ? st(rule(r).status) : "";
  document.getElementById("main").innerHTML = `
    <div class="card verdict" style="--c:${color}">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${pill(h.decision)}<span class="mono faint">${h.code}</span><span class="faint">·</span><span class="muted">${esc(CODE[h.code])}</span></div>
      <h1>${esc(c.name)} <span class="faint" style="font-weight:400">vs</span> ${esc(h.hit.name)}</h1>
      <div class="reason">${linkReason(h.reason, h.evidence)}</div>
      <div class="srcs"><span class="muted" style="font-size:12px;margin-right:4px">Evidence</span>${h.evidence.map(e => chip(e, true)).join("") || '<span class="faint">none</span>'}</div>
    </div>
    <div class="card" style="overflow:auto">
      <table class="cmp">
        <tr><th>Fact</th><th>Customer ${h.record ? `· <span class="mono">${esc(h.record)}</span>` : ""}</th><th>Watchlist hit · <span class="mono">${h.hit_id}</span></th><th>Check</th></tr>
        <tr><td>Type</td><td>${esc(p?.kind || c.entity_type)}</td><td>${esc(h.hit.kind)}</td><td>${rowSt("ENTITY_TYPE_MISMATCH")}</td></tr>
        <tr><td>Name</td><td>${custName}</td><td>${esc(h.hit.name)}${h.hit.aliases.length ? `<div class="faint" style="font-size:12px">aliases: ${esc(h.hit.aliases.slice(0, 4).join(", "))}</div>` : ""}</td><td>${rowSt("NAME_MISMATCH_VERIFIED")}</td></tr>
        <tr><td>Date of birth</td><td>${custDob}</td><td>${hitDob}</td><td>${rowSt("DOB_MISMATCH")}</td></tr>
        <tr><td>Countries</td><td>${custCountries}</td><td>${hitCountries}</td><td>${rowSt("LOCATION_MISMATCH")}</td></tr>
        <tr><td>Timeline</td><td>screened ${esc(h.alert.screened_at)}</td><td>${h.hit.reports.length ? `earliest dated report ${esc(h.hit.reports[0])}` : '<span class="faint">no dated report</span>'}${h.hit.death ? `<br>died ${esc(h.hit.death)}` : ""}</td><td>${rowSt("TEMPORAL_IMPOSSIBILITY")} ${rowSt("DECEASED")}</td></tr>
      </table>
    </div>
    <div class="two">
      <div class="card sec"><h3>Rules, in the order they ran</h3><div class="rules">${(p?.trace || []).map(t => `<div class="r"><b>${esc(RULE[t.rule] || t.rule)}</b>${st(t.status)}<span class="muted">${esc(t.detail)}</span></div>`).join("") || '<span class="faint">No customer was found, so no rule could run.</span>'}</div></div>
      <div class="card sec"><h3>How we found the customer</h3>
        <p style="margin:0 0 10px">${h.alert.link ? `Followed <b>${esc(h.alert.link.kind)}</b> <span class="mono">${esc(h.alert.link.value)}</span> to ${h.alert.linked.map(r => chip(r)).join(" ")}` : "No link on the alert: searched all customer records for name, date of birth, country and city."}</p>
        <p class="muted" style="margin:0 0 10px">Screened as <b>${esc(c.name)}</b>${c.dob ? `, born ${esc(c.dob)}` : ""}${c.country ? `, ${esc(c.country)}` : ""}${c.city ? `, ${esc(c.city)}` : ""}.</p>
        ${h.persons.length > 1 ? `<p><span class="st blocked">${h.persons.length} different people fit</span> each was decided separately: ${h.persons.map(x => `${chip(x.record)} → ${esc(x.decision)}`).join(", ")}</p>` : ""}
        ${p && p.records.length > 1 ? `<p style="margin:0">One person, several records: ${p.merges.map(m => `${chip(m.a)} + ${chip(m.b)} <span class="muted">(${esc(m.why)})</span>`).join("<br>")}</p>` : ""}
        <h3 style="margin-top:16px">All sources looked at</h3>
        <div class="srcs">${p ? [...p.records, ...p.checks, ...p.notes].map(id => chip(id, h.evidence.includes(id))).join("") : ""}</div>
      </div>
    </div>
    ${h.label ? `<div class="labelbox"><b>${h.label.decision === h.decision ? "✓ Matches" : "✕ Differs from"} the practice label</b> · expected ${esc(h.label.decision)} ${esc(h.label.codes.join(" / "))}<div class="muted" style="margin-top:6px">${esc(h.label.reason)}</div></div>` : ""}`;
}
onHit(render);
</script>
</body>
</html>
